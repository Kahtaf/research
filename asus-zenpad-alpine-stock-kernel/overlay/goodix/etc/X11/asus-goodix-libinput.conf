# Derived from z380m-alpine xorg.conf, modified 2026-11-08 for Goodix RAM trials.
# Xorg on mtkfb with the validated physical Goodix panel through libinput.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AllowEmptyInput" "true"
    Option "DontZap" "true"
EndSection

Section "Module"
    Disable "glx"
EndSection

Section "Device"
    Identifier "fb0"
    Driver "fbdev"
    VendorName "kaantcp"
    BoardName "z380m-alpine https://github.com/kaantcp"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "panel"
    VendorName "kaantcp"
    ModelName "z380m-alpine https://github.com/kaantcp"
EndSection

Section "Screen"
    Identifier "screen0"
    Device "fb0"
    Monitor "panel"
    DefaultDepth 24
    DefaultFbBpp 32
    SubSection "Display"
        Depth 24
        FbBpp 32
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "touch0"
    Driver "libinput"
    # The session replaces this token with the validated canonical event path.
    Option "Device" "@GOODIX_DEVICE@"
EndSection

Section "ServerLayout"
    Identifier "z380m"
    Screen 0 "screen0" 0 0
    InputDevice "touch0" "CorePointer"
EndSection
