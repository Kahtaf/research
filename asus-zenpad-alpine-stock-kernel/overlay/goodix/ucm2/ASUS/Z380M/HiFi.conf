SectionVerb {
	# No enable writes merely for selecting HiFi.
	# Explicit inactive/off transition also shuts down the speaker route.
	DisableSequence [
		cdev "hw:${CardNumber}"
		cset "name='Ext_Speaker_Amp_Switch' Off"
		cset "name='Speaker_Amp_Switch' Off"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker"
	EnableSequence [
		cdev "hw:${CardNumber}"
		cset "name='Audio_Speaker_PGA_gain' 0Db"
		cset "name='Audio_Speaker_class_Switch' CLASSAB"
		cset "name='Speaker_Amp_Switch' On"
		cset "name='Ext_Speaker_Amp_Switch' On"
		usleep 25000
	]
	DisableSequence [
		cdev "hw:${CardNumber}"
		cset "name='Ext_Speaker_Amp_Switch' Off"
		cset "name='Speaker_Amp_Switch' Off"
	]
	Value {
		PlaybackPCM "hw:${CardNumber},0"
		PlaybackCTL "hw:${CardNumber}"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackPriority 100
	}
}
